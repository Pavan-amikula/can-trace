[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "can-trace"
version = "0.1.0"
description = "Interpretable tensor-network CAN intrusion detection and forensic replay"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "torch>=2.5,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-can>=4.5,<5", "matplotlib>=3.9,<4", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "playwright>=1.50", "imageio[ffmpeg]>=2.35"]

[project.scripts]
can-trace = "cantrace.cli:main"

[tool.setuptools]
packages = ["cantrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
